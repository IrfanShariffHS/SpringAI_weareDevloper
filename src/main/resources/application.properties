# ==========================================
# Application
# ==========================================

spring.application.name=agent

server.port=8080

# ==========================================
# Logging
# ==========================================

logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.jdbc=INFO

# ==========================================
# Amazon Bedrock Chat Model
# ==========================================

spring.ai.bedrock.converse.chat.model=global.anthropic.claude-sonnet-4-5-20250929-v1:0

spring.ai.bedrock.converse.chat.max-tokens=4096

# ==========================================
# Amazon Titan Embedding Model
# ==========================================

spring.ai.bedrock.titan.embedding.model=amazon.titan-embed-text-v2:0

spring.ai.bedrock.titan.embedding.input-type=text

# ==========================================
# PostgreSQL Database
# ==========================================

spring.datasource.url=${SPRING_DATASOURCE_URL}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JDBC Chat Memory
# ==========================================

spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# ==========================================
# PGVector
# ==========================================

spring.ai.vectorstore.pgvector.initialize-schema=true

spring.ai.vectorstore.pgvector.dimensions=1024

# ==========================================
# Disable Cohere Embedding Auto Configuration
# ==========================================

spring.autoconfigure.exclude=org.springframework.ai.model.bedrock.cohere.autoconfigure.BedrockCohereEmbeddingAutoConfiguration



# MCP Client Configuration
spring.ai.mcp.client.toolcallback.enabled=true